<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王刷新監控系統 Firestore 版（機甲 HUD）</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background:
                radial-gradient(circle at top, #050915 0, #020409 48%, #000 100%),
                repeating-linear-gradient(135deg, rgba(0,255,255,0.03) 0, rgba(0,255,255,0.03) 1px, transparent 1px, transparent 4px);
            color: #e5f7ff;
            min-height: 100vh;
            padding-top: 132px;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background:
                linear-gradient(90deg, rgba(5,10,30,0.98), rgba(4,18,40,0.98)),
                radial-gradient(circle at 0 0, rgba(0,255,200,0.22), transparent 55%);
            border-bottom: 2px solid rgba(0,255,200,0.6);
            box-shadow:
                0 0 40px rgba(0,0,0,1),
                0 0 24px rgba(0,255,200,0.25);
        }

        .header::before,
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, rgba(0,255,180,0.0), rgba(0,255,180,0.8), rgba(0,255,180,0.0));
            opacity: 0.8;
        }
        .header::before { left: 40px; }
        .header::after { right: 40px; }

        #countdownBox {
            font-family:'Rajdhani','Microsoft JhengHei',sans-serif;
            display:flex;
            flex-direction:column;
            gap:4px;
        }
        #lastSpawnLine {
            font-size: 1.1em;
            letter-spacing: 0.12em;
            color:#9fffe0;
            text-shadow:0 0 10px rgba(0,255,210,0.8);
        }
        #nextSpawnLine {
            font-size: 2.4em;
            font-weight:700;
            letter-spacing:0.18em;
            text-transform:uppercase;
            color:#f9fffc;
            text-shadow:
                0 0 12px rgba(0,0,0,1),
                0 0 18px rgba(0,255,200,0.85);
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 430px;
            margin: 0 24px;
        }

        #search {
            width: 100%;
            padding: 10px 18px 10px 42px;
            background: linear-gradient(135deg, #050b16, #071624);
            border-radius: 999px;
            border: 1px solid rgba(0,255,190,0.65);
            color: #e5f7ff;
            font-size: 14px;
            box-shadow:
                0 0 12px rgba(0,255,200,0.3),
                0 0 0 1px rgba(0,0,0,0.9) inset;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        #search:focus {
            outline: none;
            border-color: #00ffe0;
            background: linear-gradient(135deg, #071626, #02060f);
            box-shadow:
                0 0 18px rgba(0,255,220,0.95),
                0 0 0 1px rgba(0,0,0,1) inset;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: #6fe4ff;
        }

        .search-status {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            color: #00ffd9;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid rgba(0,255,200,0.7);
            background: rgba(0,40,30,0.85);
            text-shadow: 0 0 8px rgba(0,255,200,0.9);
        }

        .suggestions {
            position: absolute;
            top: 108%;
            left: 0; right: 0;
            background: #020710;
            border-radius: 10px;
            border: 1px solid rgba(0,255,190,0.7);
            box-shadow: 0 14px 32px rgba(0,0,0,0.95);
            max-height: 260px;
            overflow-y: auto;
            z-index: 20;
        }

        .suggestion-item {
            padding: 9px 14px;
            font-size: 13px;
            color: #dde9ff;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background: linear-gradient(90deg, rgba(0,255,200,0.12), rgba(0,140,255,0.18));
        }

        #volumeControl {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-label {
            font-size: 13px;
            color: #7ce5ff;
            text-shadow: 0 0 8px rgba(0,255,255,0.6);
        }

        #volume {
            width: 140px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 999px;
            background: linear-gradient(90deg, #071520, #020509);
            border: 1px solid rgba(0,255,200,0.8);
            box-shadow:
                0 0 12px rgba(0,255,200,0.4),
                0 0 0 1px rgba(0,0,0,1) inset;
        }

        #volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            background: linear-gradient(135deg, #00ffe0, #0ff);
            box-shadow:
                0 0 18px rgba(0,255,220,0.95),
                0 0 0 1px rgba(0,0,0,1);
            cursor: pointer;
        }

        .recent-spawn-bar {
            position: fixed;
            top: 74px;
            left: 32px;
            right: 32px;
            z-index: 900;
            padding: 6px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, rgba(0,30,22,0.96), rgba(0,8,14,0.96));
            border: 1px solid rgba(0,255,210,0.8);
            box-shadow:
                0 10px 26px rgba(0,0,0,0.95),
                0 0 18px rgba(0,255,200,0.5);
            font-size: 13px;
        }

        .recent-spawn-label { color:#82ffe4;font-weight:600; }
        .recent-spawn-text { color:#e5f7ff; }

        .recent-spawn-fade {
            opacity: 0;
            transition: opacity 0.6s ease-out;
        }

        .boss-cards {
            max-width: 1240px;
            margin: 132px auto 40px;
            padding: 0 28px 60px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px 22px;
            min-height: 380px;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 56px 20px;
            color: #9db3ff;
            font-size: 17px;
            background: linear-gradient(135deg, rgba(4,10,24,0.96), rgba(2,8,18,0.98));
            border-radius: 16px;
            border: 1px dashed rgba(0,255,210,0.6);
            box-shadow: 0 14px 34px rgba(0,0,0,0.95);
        }

        .boss-card {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(135deg, #040914, #050f1e);
            border-radius: 16px;
            padding: 14px 16px 12px;
            border: 1px solid rgba(0,255,210,0.55);
            box-shadow:
                0 12px 26px rgba(0,0,0,0.95),
                0 0 20px rgba(0,255,200,0.25);
            overflow: hidden;
            clip-path: polygon(0 10px,10px 0,100% 0,100% 100%,0 100%);
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out, border-color 0.15s;
        }

        .boss-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 40px;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, rgba(0,255,210,0.0), rgba(0,255,210,0.8), rgba(0,255,210,0.0));
            opacity: 0.8;
        }

        .boss-card::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 40px;
            height: 16px;
            background: linear-gradient(135deg, rgba(0,255,210,0.3), transparent 60%);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 14px 100%);
            opacity: 0.7;
        }

        .boss-card:hover {
            border-color: #00ffe0;
            box-shadow:
                0 16px 36px rgba(0,0,0,1),
                0 0 26px rgba(0,255,210,0.8);
            transform: translateY(-3px);
        }

        @keyframes spawnPulse {
            0%   { box-shadow: 0 0 0 0 rgba(0,255,210,0.9); }
            50%  { box-shadow: 0 0 24px 6px rgba(0,255,210,0.9); }
            100% { box-shadow: 0 0 0 0 rgba(0,255,210,0.0); }
        }
        .boss-card.just-spawned {
            border-color: #00ffe0 !important;
            animation: spawnPulse 1s ease-out infinite;
        }

        .boss-header { display:flex;align-items:center;gap:10px; }
        .boss-title-block { flex:1;min-width:0; }

        .boss-name {
            font-family:'Rajdhani','Microsoft JhengHei',sans-serif;
            font-size:1.7em;
            font-weight:700;
            letter-spacing:0.15em;
            text-transform:uppercase;
            color:#f4fff8;
            text-shadow:0 0 12px rgba(0,0,0,1),0 0 18px rgba(0,255,210,0.85);
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .boss-sub {
            margin-top:4px;
            font-size:16px;
            font-weight:600;
            color:#89ffe0;
            letter-spacing:0.5px;
            text-shadow:0 0 10px rgba(0,255,210,0.85);
        }

        .boss-actions { display:flex;align-items:center;gap:10px; }
        .toggle-container { display:flex;align-items:center;gap:5px; }
        .toggle-label { font-size:11px;color:#d0e4ff; }

        .toggle {
            width:46px;
            height:20px;
            border-radius:999px;
            border:1px solid rgba(0,255,210,0.7);
            background:linear-gradient(135deg,#050913,#020305);
            position:relative;
            cursor:pointer;
            box-shadow:0 0 10px rgba(0,0,0,0.9);
            transition:background 0.15s,box-shadow 0.15s,border-color 0.15s;
        }

        .toggle::after {
            content:'';
            position:absolute;
            top:2px;left:2px;
            width:16px;height:16px;
            border-radius:4px;
            background:linear-gradient(135deg,#00ffe0,#0ff);
            box-shadow:0 0 10px rgba(0,255,220,0.9),0 0 0 1px rgba(0,0,0,1);
            transition:transform 0.16s;
        }

        .toggle.active {
            background:linear-gradient(135deg,#063222,#031018);
            border-color:#00ffe0;
            box-shadow:0 0 16px rgba(0,255,210,0.9);
        }

        .toggle.active::after { transform:translateX(24px); }

        .controls { display:flex;gap:6px; }

        .btn {
            padding:6px 12px;
            border-radius:6px;
            border:1px solid transparent;
            cursor:pointer;
            font-weight:600;
            font-size:12px;
            letter-spacing:0.4px;
            background-size:180% 180%;
            transition:transform 0.08s,box-shadow 0.08s,filter 0.1s,background-position 0.2s;
        }

        .btn-primary {
            background-image:linear-gradient(135deg,#0aa0ff,#00ffe0);
            border-color:rgba(0,200,255,0.9);
            color:#041018;
            box-shadow:0 0 14px rgba(0,200,255,0.9),0 0 0 1px rgba(0,0,0,1);
        }

        .btn-danger {
            background-image:linear-gradient(135deg,#ff5b6a,#ffb34a);
            border-color:rgba(255,120,100,0.9);
            color:#140203;
            box-shadow:0 0 14px rgba(255,120,100,0.9),0 0 0 1px rgba(0,0,0,1);
        }

        .btn-primary:hover,
        .btn-danger:hover {
            transform:translateY(-1px);
            filter:brightness(1.05);
            background-position:100% 0;
        }

        .btn:active {
            transform:translateY(1px) scale(0.97);
            box-shadow:0 0 6px rgba(0,0,0,1);
        }

        .boss-main {
            display:grid;
            grid-template-columns:minmax(0,2.1fr) minmax(0,1.5fr);
            gap:8px;
            margin-top:4px;
        }

        .input-group { margin:0; }

        .input-group label {
            display:block;
            margin-bottom:3px;
            color:#9fb8ff;
            font-size:11px;
            letter-spacing:0.6px;
        }

        .input-group input {
            width:100%;
            height:32px;
            padding:5px 8px;
            border-radius:6px;
            border:1px solid rgba(0,255,210,0.45);
            background:linear-gradient(135deg,#050b16,#020508);
            color:#e5f7ff;
            font-size:13px;
            box-shadow:inset 0 0 0 1px rgba(0,0,0,0.8);
            transition:border-color 0.18s,box-shadow 0.18s,background 0.18s;
        }

        .input-group input:focus {
            outline:none;
            border-color:#00ffe0;
            background:linear-gradient(135deg,#071626,#020306);
            box-shadow:0 0 10px rgba(0,255,210,0.9),inset 0 0 0 1px rgba(0,0,0,1);
        }

        .time-input-row {
            display:flex;
            gap:6px;
            align-items:center;
        }

        .time-input-row input { width:58px; }

        .predict-times {
            position:relative;
            grid-column:2 / 3;
            margin-top:0;
            padding:8px 10px 10px 14px;
            border-radius:10px;
            background:linear-gradient(135deg,rgba(3,16,32,0.96),rgba(2,8,20,0.98));
            border:1px solid rgba(0,200,255,0.65);
            font-size:12px;
            color:#d7eaff;
            box-shadow:0 0 0 1px rgba(0,0,0,1) inset,0 0 16px rgba(0,0,0,0.9);
        }

        .predict-times::before {
            content:'';
            position:absolute;
            left:0;top:0;bottom:0;
            width:3px;
            background:linear-gradient(180deg,#00ffe0,#00a0ff);
            box-shadow:0 0 12px rgba(0,255,220,0.9),0 0 20px rgba(0,160,255,0.7);
        }

        .predict-times strong {
            display:block;
            margin-bottom:4px;
            font-weight:600;
            color:#82ffe4;
            text-shadow:0 0 10px rgba(0,255,210,0.9);
        }

        .predict-item {
            display:block;
            margin-top:2px;
            font-family:'Rajdhani','Microsoft JhengHei',sans-serif;
            letter-spacing:0.06em;
        }

        .add-boss-btn{
            position:fixed;
            bottom:28px;
            right:28px;
            width:60px;
            height:60px;
            border-radius:16px;
            border:1px solid rgba(0,255,210,0.9);
            background:radial-gradient(circle at 30% 20%,#00ffe0,#00aaff 55%,#004a70 100%);
            color:#021014;
            font-size:32px;
            cursor:pointer;
            box-shadow:0 0 26px rgba(0,255,220,0.95),0 0 40px rgba(0,120,255,0.85);
            transition:transform .14s,box-shadow .14s;
            display:none;
            align-items:center;
            justify-content:center;
        }

        .event-log {
            position: fixed;
            right: 12px;
            bottom: 12px;
            width: 260px;
            max-height: 260px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(2,8,16,0.94);
            border: 1px solid rgba(0,255,210,0.7);
            box-shadow:
                0 12px 26px rgba(0,0,0,1),
                0 0 22px rgba(0,255,210,0.5);
            font-size: 11px;
            overflow-y: auto;
        }

        .event-log-title { font-weight:600;color:#82ffe4;margin-bottom:4px; }
        .event-log-item { padding:1px 0;border-bottom:1px dashed rgba(0,255,210,0.2);color:#d3e5ff; }
        .event-log-item:last-child { border-bottom:none; }

        .modal {
            display:none;
            position:fixed;
            z-index:1000;
            left:0;top:0;
            width:100%;height:100%;
            background:radial-gradient(circle at center,rgba(3,8,18,0.95),rgba(0,0,0,0.98));
        }

        .modal-content {
            margin:7% auto;
            padding:26px 24px 24px;
            width:90%;
            max-width:520px;
            border-radius:16px;
            background:linear-gradient(135deg,#050b16,#020509);
            border:1px solid rgba(0,255,210,0.8);
            box-shadow:0 20px 48px rgba(0,0,0,1),0 0 26px rgba(0,255,220,0.7);
            position:relative;
            animation:slideIn 0.28s;
            clip-path:polygon(0 14px,14px 0,100% 0,100% 100%,0 100%);
        }

        @keyframes slideIn {
            from { transform:translateY(-40px);opacity:0; }
            to   { transform:translateY(0);opacity:1; }
        }

        .close {
            position:absolute;
            right:14px;
            top:8px;
            font-size:26px;
            font-weight:bold;
            color:#8ddfff;
            cursor:pointer;
            text-shadow:0 0 10px rgba(0,255,255,0.9);
        }

        .close:hover { color:#fff; }

        @media (max-width: 900px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 12px 16px 14px;
            }
            #nextSpawnLine { font-size: 2em; }
            .recent-spawn-bar { left: 12px; right: 12px; top: 90px; }
            .boss-cards {
                grid-template-columns: 1fr;
                margin-top: 148px;
                padding: 0 16px 72px;
            }
            .boss-main { grid-template-columns: 1fr; }
            .predict-times {
                grid-column: 1 / -1;
                margin-top: 6px;
            }
            .event-log {
                right: 10px;
                bottom: 10px;
                width: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div id="countdownBox">
            <div id="lastSpawnLine">尚無重生紀錄</div>
            <div id="nextSpawnLine">所有王已重生</div>
        </div>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" placeholder="搜索王名稱...">
            <span class="search-status" id="searchStatus">共 0 個王</span>
            <div id="suggestions" class="suggestions" style="display:none;"></div>
        </div>
        <div id="volumeControl">
            <span class="volume-label">🔊</span>
            <input type="range" id="volume" min="0" max="100" step="1" value="50">
            <span class="volume-label" id="volumeValue">50%</span>
            <button id="soundToggleBtn"
                    style="margin-left:10px;padding:6px 14px;border-radius:999px;
                           border:1px solid #4dff4d;background:#091327;
                           color:#4dff4d;font-size:12px;cursor:pointer;">
                音效已開啟
            </button>
        </div>
    </div>

    <div class="recent-spawn-bar" id="recentSpawnBar" style="display:none;">
        <span class="recent-spawn-label">最近重生</span>
        <span class="recent-spawn-text" id="recentSpawnText">尚無資料</span>
    </div>

    <div class="boss-cards" id="bossCards"></div>
    <button class="add-boss-btn" onclick="openAddModal()" title="新增王">+</button>

    <div class="event-log" id="eventLog">
        <div class="event-log-title">最近事件</div>
        <div id="eventLogList"></div>
    </div>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddModal()">&times;</span>
            <h2 style="margin-bottom:16px;color:#7ce5ff;text-shadow:0 0 12px rgba(124,229,255,0.7);">
                新增王 (寫入 Firestore)
            </h2>
            <div class="input-group">
                <label>王名稱</label>
                <input type="text" id="newBossName" placeholder="輸入王名稱">
            </div>
            <div class="input-group">
                <label>預設重生間隔(分鐘)</label>
                <input type="number" id="newRespawnMinutes" value="180" min="1">
            </div>
            <div class="input-group">
                <label>擊殺用時(分鐘)</label>
                <input type="number" id="newKillTime" value="2" min="0">
            </div>
            <button class="btn btn-primary" onclick="addNewBoss()" style="width:100%;margin-top:20px;">新增王</button>
        </div>
    </div>

    <script>
        let masterVol = 0.8;
        let audioCtx = null;

        function getOrCreateOwnerId() {
            const KEY = 'WANGR_OWNER_ID';
            let id = localStorage.getItem(KEY);
            if (id) return id;
            const rand = Math.random().toString(36).slice(2);
            const ts = Date.now().toString(36);
            id = 'pc_' + ts + '_' + rand;
            localStorage.setItem(KEY, id);
            return id;
        }
        const OWNER_ID = getOrCreateOwnerId();

        const firebaseConfig = {
          apiKey: "AIzaSyAgV1fpP2XRS5fhgg4h0clp9AEJqAJtypo",
          authDomain: "wangr-sync.firebaseapp.com",
          projectId: "wangr-sync",
          storageBucket: "wangr-sync.firebasestorage.app",
          messagingSenderId: "178110502200",
          appId: "1:178110502200:web:adb5dc30cf34c5f0dc9dcd",
          measurementId: "G-ZN1H4KHEJR"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const bossesRef = db.collection('bosses');
        const bossNamesRef = db.collection('boss_events');
        const templatesRef = db.collection('boss_templates');
        const bossStateRef = db.collection('boss_state');

        let bosses = {};
        let soundEnabled = true;

        const localRuntime = {
            alerts: {},
            shared: {},
            spawnLog: [],
            initialScanDone: false,
            lastHeaderMsg: null
        };

        function parseTimeToTodayMillis(timeStr) {
            if (!timeStr) return null;
            const parts = timeStr.split(':');
            if (parts.length < 2) return null;
            const h = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            if (isNaN(h) || isNaN(m)) return null;

            const now = new Date();
            let d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
            const diff = d.getTime() - now.getTime();
            if (diff > 3 * 60 * 60 * 1000) d.setDate(d.getDate() - 1);
            return d.getTime();
        }

        function calcNextSpawnMillis(baseMillis, respawnMinutes, killTime) {
            if (baseMillis == null) return null;
            const respawnMs = (respawnMinutes ?? 60) * 60000;
            const killMs = (killTime ?? 0) * 60000;
            const step = respawnMs + killMs;
            const now = Date.now();
            const firstSpawn = baseMillis + step;
            if (firstSpawn > now) return firstSpawn;

            const passed = now - baseMillis;
            const k = Math.floor(passed / step);
            return baseMillis + (k + 1) * step;
        }

        function init() {
            loadBosses();
            setupSearch();
            setupVolume();
            setupSoundToggle();
            setInterval(() => {
                updateGlobalCountdown();
                checkBossAlerts();
                updateFutureBlocks();
            }, 1000);
        }

        function loadBosses() {
            bossesRef.where('ownerId','==',OWNER_ID)
                .onSnapshot((snap) => {
                    const data = {};
                    snap.forEach(doc => {
                        data[doc.id] = { id: doc.id, ...doc.data() };
                    });
                    bosses = data;
                    renderBossCards();
                    updateSearchStatus();

                    if (!localRuntime.initialScanDone) {
                        localRuntime.initialScanDone = true;
                        refreshLastSpawnLine();
                    }
                }, (err) => {
                    console.error('載入 bosses 發生錯誤：', err);
                    document.getElementById('searchStatus').textContent = '讀取錯誤';
                });

            bossStateRef.where('ownerId','==',OWNER_ID)
                .onSnapshot((snap) => {
                    const shared = {};
                    snap.forEach(doc => {
                        const data = doc.data();
                        if (!data.bossName) return;
                        shared[data.bossName] = data;
                    });
                    localRuntime.shared = shared;
                }, (err) => {
                    console.error('同步 boss_state 錯誤', err);
                });
        }

        function setupSearch() {
            const searchInput = document.getElementById('search');
            const suggBox = document.getElementById('suggestions');

            let allBossNames = [];

            bossNamesRef.onSnapshot((snap) => {
                const seen = new Set();
                const list = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    const name = data.boss;
                    if (!name) return;
                    if (!seen.has(name)) {
                        seen.add(name);
                        list.push(name);
                    }
                });
                allBossNames = list;
            }, (err) => {
                console.error('同步 boss_events 錯誤', err);
            });

            searchInput.addEventListener('input', (e) => {
                const keyword = e.target.value.trim();
                if (!keyword) {
                    suggBox.style.display = 'none';
                    suggBox.innerHTML = '';
                    return;
                }
                const lower = keyword.toLowerCase();
                const results = allBossNames.filter(n =>
                    n.toLowerCase().includes(lower)
                ).slice(0, 50);

                if (results.length === 0) {
                    suggBox.innerHTML = `<div class="suggestion-item">沒有找到「${keyword}」的王名</div>`;
                } else {
                    suggBox.innerHTML = results.map(n =>
                        `<div class="suggestion-item" onclick="chooseBossName('${n.replace(/'/g,"\\'")}')">${n}</div>`
                    ).join('');
                }
                suggBox.style.display = 'block';
            });

            document.addEventListener('click', (e) => {
                if (!document.querySelector('.search-container').contains(e.target)) {
                    suggBox.style.display = 'none';
                }
            });
        }

        function setupVolume() {
            const slider = document.getElementById('volume');
            const label = document.getElementById('volumeValue');
            if (!slider || !label) return;

            const saved = Number(localStorage.getItem('masterVol'));
            masterVol = isNaN(saved) ? 0.5 : saved;
            slider.value = Math.round(masterVol * 100);
            label.textContent = Math.round(masterVol * 100) + '%';

            slider.addEventListener('input', e => {
                const v = Number(e.target.value) / 100;
                masterVol = v;
                localStorage.setItem('masterVol', masterVol);
                label.textContent = Math.round(masterVol * 100) + '%';
            });
        }

        function setupSoundToggle() {
            const btn = document.getElementById('soundToggleBtn');

            function refreshLabel() {
                btn.textContent = soundEnabled ? '音效已開啟' : '啟用音效';
                btn.style.color = soundEnabled ? '#4dff4d' : '#7ce5ff';
                btn.style.borderColor = soundEnabled ? '#4dff4d' : 'rgba(124,229,255,0.7)';
            }
            refreshLabel();

            btn.addEventListener('click', async () => {
                soundEnabled = !soundEnabled;
                refreshLabel();
                try {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (audioCtx.state === 'suspended') {
                        await audioCtx.resume();
                    }
                } catch(e) {}
                if (soundEnabled) playBeep(2);
            });
        }

        function chooseBossName(name) {
            const suggBox = document.getElementById('suggestions');
            suggBox.style.display = 'none';
            document.getElementById('search').value = name;
            openAddModal();
            document.getElementById('newBossName').value = name;
        }

        function renderBossCards() {
            const container = document.getElementById('bossCards');
            container.innerHTML = '';

            const entries = Object.entries(bosses);
            if (entries.length === 0) {
                const noResult = document.createElement('div');
                noResult.className = 'no-results';
                noResult.innerHTML = `目前尚未新增任何王，請從上方搜尋王名後新增。`;
                container.appendChild(noResult);
                return;
            }

            entries.forEach(([id, boss]) => {
                container.appendChild(createBossCard(id, boss));
            });
        }

        function updateSearchStatus() {
            const statusEl = document.getElementById('searchStatus');
            const total = Object.keys(bosses).length;
            statusEl.textContent = `共 ${total} 個王`;
        }

        function getSharedStateForBossName(name) {
            return localRuntime.shared[name] || null;
        }

        function predictNextSpawns(boss) {
            const respawnMinutes = boss.respawnMinutes ?? boss.respawn ?? 60;
            const killTime = boss.killTime || boss.killtime || 0;

            const shared = getSharedStateForBossName(boss.name || '');
            let baseMillis = null;
            if (shared && shared.lastDeathTime) {
                baseMillis = shared.lastDeathTime;
            } else if (boss.deathTime) {
                baseMillis = parseTimeToTodayMillis(boss.deathTime);
            } else {
                return [];
            }

            const firstSpawn = calcNextSpawnMillis(baseMillis, respawnMinutes, killTime);
            if (!firstSpawn) return [];

            const respawnMs = respawnMinutes * 60000;
            const killMs = killTime * 60000;
            const step = respawnMs + killMs;

            return [
                firstSpawn,
                firstSpawn + step,
                firstSpawn + 2 * step,
                firstSpawn + 3 * step
            ];
        }

        function renderFutureText(list) {
            if (!list.length) return '<span class="predict-item">--</span>';
            return list.map((t,i)=>
                `<span class="predict-item">第${i+1}次 ${
                    new Date(t).toLocaleTimeString('zh-TW',{
                        timeZone:'Asia/Taipei',
                        hour:'2-digit',
                        minute:'2-digit',
                        second:'2-digit',
                        hour12:false
                    })
                }</span>`
            ).join('');
        }

        function createBossCard(id, boss) {
            const div = document.createElement('div');
            div.className = 'boss-card';
            div.dataset.bossId = id;

            const deathTime = boss.deathTime || '';
            const [dh, dm] = deathTime.split(':');
            const respawnMinutes = boss.respawnMinutes ?? boss.respawn ?? 60;
            const killTime = boss.killTime || boss.killtime || 0;
            const alertEnabled = boss.notify ?? boss.alertEnabled ?? true;
            const futures = predictNextSpawns(boss);
            let subText = '待擊殺';
            if (futures.length > 0) {
                const first = new Date(futures[0]);
                const hh = String(first.getHours()).padStart(2,'0');
                const mm = String(first.getMinutes()).padStart(2,'0');
                subText = `下一次重生  ${hh}:${mm}`;
            }

            if (!localRuntime.alerts[id]) {
                localRuntime.alerts[id] = { threeMinAlerted: false, spawnAlerted: false, lastSeenNextSpawn: null };
            }

            div.innerHTML = `
                <div class="boss-header">
                    <div class="boss-title-block">
                        <div class="boss-name">${boss.name || '未知王'}</div>
                        <div class="boss-sub" data-boss-id="${id}">${subText}</div>
                    </div>

                    <div class="boss-actions">
                        <div class="toggle-container">
                            <span class="toggle-label">${alertEnabled ? '提醒中' : '不提醒'}</span>
                            <div class="toggle ${alertEnabled ? 'active' : ''}" onclick="toggleAlert('${id}')"></div>
                        </div>
                        <div class="controls">
                            <button class="btn btn-primary" onclick="killBoss('${id}')">⚔️ 擊殺</button>
                            <button class="btn btn-danger" onclick="deleteBoss('${id}')">🗑️ 刪除</button>
                        </div>
                    </div>
                </div>

                <div class="boss-main">
                    <div>
                        <div class="input-group">
                            <label>💀 死亡時間</label>
                            <div class="time-input-row">
                                <input type="number" min="0" max="23" placeholder="時"
                                       value="${dh || ''}"
                                       id="deathHour-${id}">
                                <input type="number" min="0" max="59" placeholder="分"
                                       value="${dm || ''}"
                                       id="deathMin-${id}">
                                <button class="btn btn-primary" style="padding:4px 10px;font-size:11px;"
                                        onclick="applyDeathTime('${id}')">
                                    套用
                                </button>
                            </div>
                        </div>

                        <div class="input-group" style="margin-top:6px;">
                            <label>⏰ 重生間隔(分)</label>
                            <input type="number" min="1" value="${respawnMinutes}"
                                onchange="updateBoss('${id}','respawnMinutes',parseInt(this.value))">
                        </div>

                        <div class="input-group" style="margin-top:6px;">
                            <label>⚔️ 擊殺用時(分)</label>
                            <input type="number" min="0" value="${killTime}"
                                onchange="updateBoss('${id}','killTime',parseInt(this.value))">
                        </div>
                    </div>

                    <div class="predict-times" data-boss-id="${id}">
                        <strong>📅 未來4次</strong>
                        ${renderFutureText(futures)}
                    </div>
                </div>
            `;
            return div;
        }

        function updateFutureBlocks() {
            Object.values(bosses).forEach(boss => {
                const futures = predictNextSpawns(boss);
                const card = document.querySelector(`.predict-times[data-boss-id="${boss.id}"]`);
                if (card) {
                    card.innerHTML = `<strong>📅 未來4次</strong>${renderFutureText(futures)}`;
                }
                const sub = document.querySelector(`.boss-sub[data-boss-id="${boss.id}"]`);
                if (sub && futures.length > 0) {
                    const first = new Date(futures[0]);
                    const hh = String(first.getHours()).padStart(2,'0');
                    const mm = String(first.getMinutes()).padStart(2,'0');
                    sub.textContent = `下一次重生  ${hh}:${mm}`;
                }
            });
        }

        async function applyDeathTime(id) {
            const boss = bosses[id];
            if (!boss) return;

            const hourInput = document.getElementById(`deathHour-${id}`);
            const minInput  = document.getElementById(`deathMin-${id}`);
            if (!hourInput || !minInput) return;

            const h = String(parseInt(hourInput.value || '0', 10)).padStart(2,'0');
            const m = String(parseInt(minInput.value  || '0', 10)).padStart(2,'0');
            const value = `${h}:${m}`;

            const respawnMinutes = boss.respawnMinutes ?? boss.respawn ?? 60;
            const killTime = boss.killTime || boss.killtime || 0;
            const baseMillis = parseTimeToTodayMillis(value);

            try {
                await bossesRef.doc(id).update({
                    deathTime: value,
                    lastUpdated: Date.now()
                });
            } catch(e) {
                console.error('套用死亡時間失敗', e);
            }

            if (boss.name) {
                const nextSpawn = calcNextSpawnMillis(baseMillis, respawnMinutes, killTime);
                try {
                    await bossStateRef.doc(boss.name).set({
                        bossName: boss.name,
                        lastDeathTime: baseMillis,
                        nextSpawn,
                        respawnMinutes,
                        killTime,
                        updatedAt: Date.now()
                    }, { merge: true });
                    localRuntime.shared[boss.name] = {
                        lastDeathTime: baseMillis,
                        nextSpawn,
                        respawnMinutes,
                        killTime
                    };
                } catch(e) {
                    console.error('更新共用狀態失敗', e);
                }
            }

            if (localRuntime.alerts[id]) {
                localRuntime.alerts[id].threeMinAlerted = false;
                localRuntime.alerts[id].spawnAlerted = false;
                localRuntime.alerts[id].lastSeenNextSpawn = null;
            }

            pushSpawnLog(`[調整] ${boss.name || '未知王'} 死亡時間改為 ${value}`);
            refreshLastSpawnLine();
        }

        function updateBoss(id, field, value) {
            const boss = bosses[id];
            bossesRef.doc(id).update({
                [field]: value,
                lastUpdated: Date.now()
            }).catch(e => console.error('更新失敗', e));

            if (boss && (field === 'respawnMinutes' || field === 'killTime')) {
                const label = field === 'respawnMinutes' ? '重生間隔' : '擊殺用時';
                pushSpawnLog(`[調整] ${boss.name || '未知王'} ${label} 改為 ${value} 分鐘`);
            }
        }

        function toggleAlert(id) {
            const boss = bosses[id];
            if (!boss) return;
            const newVal = !(boss.notify ?? boss.alertEnabled ?? true);
            bossesRef.doc(id).update({
                notify: newVal,
                lastUpdated: Date.now()
            }).catch(e => console.error('切換提醒失敗', e));
        }

        async function killBoss(id) {
            const boss = bosses[id];
            if (!boss) return;

            const now = new Date();
            const hh = String(now.getHours()).padStart(2,'0');
            const mm = String(now.getMinutes()).padStart(2,'0');
            const ss = String(now.getSeconds()).padStart(2,'0');
            const timeStr = `${hh}:${mm}`;

            const respawnMinutes = boss.respawnMinutes ?? boss.respawn ?? 60;
            const killTime = boss.killTime || boss.killtime || 0;
            const baseMillis = now.getTime();
            const nextSpawn = calcNextSpawnMillis(baseMillis, respawnMinutes, killTime);

            try {
                await bossesRef.doc(id).update({
                    deathTime: timeStr,
                    lastUpdated: now.getTime()
                });
            } catch(e) {
                console.error('更新死亡時間失敗', e);
            }

            if (boss.name) {
                try {
                    await bossStateRef.doc(boss.name).set({
                        bossName: boss.name,
                        lastDeathTime: baseMillis,
                        nextSpawn,
                        respawnMinutes,
                        killTime,
                        updatedAt: now.getTime()
                    }, { merge: true });
                    localRuntime.shared[boss.name] = {
                        lastDeathTime: baseMillis,
                        nextSpawn,
                        respawnMinutes,
                        killTime
                    };
                } catch(e) {
                    console.error('更新共用狀態失敗', e);
                }
            }

            if (localRuntime.alerts[id]) {
                localRuntime.alerts[id].threeMinAlerted = false;
                localRuntime.alerts[id].spawnAlerted = false;
                localRuntime.alerts[id].lastSeenNextSpawn = null;
            }

            const msg = `${boss.name || '未知王'} 已於 ${hh}:${mm}:${ss} 擊殺`;
            pushSpawnLog(msg);
            setLastSpawnMessage(msg);
        }

        async function deleteBoss(id) {
            const name = bosses[id]?.name || '此王';
            if (confirm(`確認刪除 ${name} ?`)) {
                bossesRef.doc(id).delete().catch(e => console.error('刪除失敗', e));
            }
        }

        function playBeep(times = 1) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const now = audioCtx.currentTime;
                for (let i = 0; i < times; i++) {
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(880, now + i * 0.2);
                    gainNode.gain.setValueAtTime(0, now + i * 0.2);
                    gainNode.gain.linearRampToValueAtTime(0.2 * masterVol, now + i * 0.2 + 0.01);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.18);
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    osc.start(now + i * 0.2);
                    osc.stop(now + i * 0.2 + 0.2);
                }
            } catch(e) {}
        }

        function addEventLog(msg) {
            const list = document.getElementById('eventLogList');
            if (!list) return;
            const now = new Date();
            const hh = String(now.getHours()).padStart(2,'0');
            const mm = String(now.getMinutes()).padStart(2,'0');
            const ss = String(now.getSeconds()).padStart(2,'0');
            const div = document.createElement('div');
            div.className = 'event-log-item';
            div.textContent = `[${hh}:${mm}:${ss}] ${msg}`;
            list.prepend(div);
            while (list.children.length > 30) {
                list.removeChild(list.lastChild);
            }
        }

        function pushSpawnLog(line) {
            localRuntime.spawnLog.unshift(line);
            localRuntime.spawnLog = localRuntime.spawnLog.slice(0, 50);
            const listEl = document.getElementById('eventLogList');
            if (listEl) {
                listEl.innerHTML = localRuntime.spawnLog.map(item =>
                    `<div class="event-log-item">${item}</div>`
                ).join('');
            }
        }

        function setLastSpawnMessage(msg) {
            const lastLine = document.getElementById('lastSpawnLine');
            if (lastLine) {
                lastLine.textContent = msg;
            }
            const bar = document.getElementById('recentSpawnBar');
            const barText = document.getElementById('recentSpawnText');
            if (bar && barText) {
                barText.textContent = msg;
                bar.style.display = 'flex';
            }
            if (!localRuntime.lastHeaderMsg || localRuntime.lastHeaderMsg !== msg) {
                localRuntime.lastHeaderMsg = msg;
                pushSpawnLog(msg);
            }
        }

        function updateGlobalCountdown() {
            const nextLine = document.getElementById('nextSpawnLine');
            if (!nextLine) return;

            const now = Date.now();
            let best = null;

            Object.values(bosses).forEach(boss => {
                const futures = predictNextSpawns(boss);
                if (!futures.length) return;
                const nextTime = futures[0];
                const diff = nextTime - now;
                if (best == null || diff < best.diff) {
                    best = { boss, nextTime, diff };
                }
            });

            if (!best) {
                nextLine.textContent = '所有王已重生';
                return;
            }

            if (best.diff <= 0) {
                const dt = new Date(best.nextTime);
                const hh = String(dt.getHours()).padStart(2,'0');
                const mm = String(dt.getMinutes()).padStart(2,'0');
                const ss = String(dt.getSeconds()).padStart(2,'0');
                const msg = `${best.boss.name || '未知王'} 已於 ${hh}:${mm}:${ss} 重生`;
                nextLine.textContent = msg;
                return;
            }

            const totalSec = Math.floor(best.diff / 1000);
            const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            const s = String(totalSec % 60).padStart(2, '0');
            nextLine.textContent = `${best.boss.name || '未知王'} 倒數 ${h}:${m}:${s}`;
        }

        function checkBossAlerts() {
            const now = Date.now();
            Object.values(bosses).forEach(boss => {
                const id = boss.id;
                const alertState = localRuntime.alerts[id] || {
                    threeMinAlerted: false,
                    spawnAlerted: false,
                    lastSeenNextSpawn: null
                };
                localRuntime.alerts[id] = alertState;

                const futures = predictNextSpawns(boss);
                if (!futures.length) return;
                const nextSpawn = futures[0];
                const diff = nextSpawn - now;

                const notify = boss.notify ?? boss.alertEnabled ?? true;
                if (!notify) return;

                if (alertState.lastSeenNextSpawn !== nextSpawn) {
                    alertState.threeMinAlerted = false;
                    alertState.spawnAlerted = false;
                    alertState.lastSeenNextSpawn = nextSpawn;
                }

                // 只保留實際重生提醒
                if (!alertState.spawnAlerted && diff <= 0 && diff > -30 * 1000) {
                    alertState.spawnAlerted = true;
                    const dt = new Date(nextSpawn);
                    const hh = String(dt.getHours()).padStart(2,'0');
                    const mm = String(dt.getMinutes()).padStart(2,'0');
                    const ss = String(dt.getSeconds()).padStart(2,'0');
                    const msg = `${boss.name || '未知王'} 已於 ${hh}:${mm}:${ss} 重生`;
                    setLastSpawnMessage(msg);
                    addEventLog(msg);
                    playBeep(3);
                    const card = document.querySelector(`.boss-card[data-boss-id="${id}"]`);
                    if (card) {
                        card.classList.add('just-spawned');
                        setTimeout(() => card.classList.remove('just-spawned'), 12000);
                    }
                }
            });
        }

        function refreshLastSpawnLine() {
            const now = Date.now();
            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);
            const todayStartMs = todayStart.getTime();

            let latest = null;

            Object.values(bosses).forEach(boss => {
                const respawnMinutes = boss.respawnMinutes ?? boss.respawn ?? 60;
                const killTime = boss.killTime || boss.killtime || 0;
                if (!respawnMinutes && !killTime) return;

                const shared = localRuntime.shared[boss.name] || null;
                let baseMillis = null;
                if (shared && shared.lastDeathTime) {
                    baseMillis = shared.lastDeathTime;
                } else if (boss.deathTime) {
                    baseMillis = parseTimeToTodayMillis(boss.deathTime);
                }
                if (!baseMillis) return;

                const step = (respawnMinutes + killTime) * 60000;
                if (step <= 0) return;

                let k = Math.floor((now - baseMillis) / step);
                if (k < 0) return;

                const lastSpawn = baseMillis + k * step;
                if (lastSpawn < todayStartMs || lastSpawn > now) return;

                if (!latest || lastSpawn > latest.time) {
                    latest = {
                        name: boss.name || '未知王',
                        time: lastSpawn
                    };
                }
            });

            if (latest) {
                const t = new Date(latest.time);
                const hh = String(t.getHours()).padStart(2,'0');
                const mm = String(t.getMinutes()).padStart(2,'0');
                const ss = String(t.getSeconds()).padStart(2,'0');
                setLastSpawnMessage(`${latest.name} 已於 ${hh}:${mm}:${ss} 重生`);
            } else {
                setLastSpawnMessage('尚無重生紀錄');
            }
        }

        function openAddModal() {
            document.getElementById('addModal').style.display = 'block';
        }
        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        async function addNewBoss() {
            const name = document.getElementById('newBossName').value.trim();
            const respawnMinutes = parseInt(document.getElementById('newRespawnMinutes').value || '180', 10);
            const killTime = parseInt(document.getElementById('newKillTime').value || '2', 10);

            if (!name) {
                alert('請輸入王名稱');
                return;
            }

            try {
                await bossesRef.add({
                    ownerId: OWNER_ID,
                    name,
                    respawnMinutes,
                    killTime,
                    deathTime: '',
                    notify: true,
                    createdAt: Date.now(),
                    lastUpdated: Date.now()
                });
                document.getElementById('newBossName').value = '';
                closeAddModal();
            } catch(e) {
                console.error('新增王失敗', e);
            }
        }

        window.addEventListener('load', init);
    </script>
</body>
